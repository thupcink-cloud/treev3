<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Plant Care</title>
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SDKs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --line-color: #06C755;
            --line-hover: #05b34c;
            --bg-gradient: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
        }

        * {
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            padding: 1.5rem;
        }

        .auth-card {
            background: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #4caf50, #2e7d32);
        }

        .brand-logo {
            width: 60px;
            height: 60px;
            background: #e8f5e9;
            color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1rem;
        }

        .auth-card h2 {
            margin-bottom: 1.5rem;
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.88rem;
            margin-bottom: 0.4rem;
            color: var(--text-main);
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            color: #a0aec0;
            font-size: 1rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.8rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            background: #f8fafc;
            color: var(--text-main);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
        }

        .password-wrapper input {
            padding-right: 2.8rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            cursor: pointer;
            color: #a0aec0;
            font-size: 1rem;
            user-select: none;
        }

        .toggle-password:hover {
            color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-line {
            background: var(--line-color);
            color: white;
            box-shadow: 0 4px 12px rgba(6, 199, 85, 0.25);
        }

        .btn-line:hover {
            background: var(--line-hover);
            transform: translateY(-1px);
        }

        .line-section {
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px dashed #e2e8f0;
        }

        #line-status {
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.8rem;
            padding: 0.5rem;
            border-radius: 8px;
            background: #fff5f5;
            color: #e53e3e;
        }

        .switch-link {
            margin-top: 1.2rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .switch-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="brand-logo">
        <i class="fa-solid fa-seedling"></i>
    </div>

    <!-- ฟอร์มเข้าสู่ระบบ -->
    <div id="loginFormSection">
        <h2>เข้าสู่ระบบ</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>ชื่อผู้ใช้ (Username)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="loginUsername" class="form-control" required placeholder="กรอกชื่อผู้ใช้">
                </div>
            </div>
            <div class="form-group">
                <label>รหัสผ่าน</label>
                <div class="input-wrapper password-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="loginPassword" class="form-control" required placeholder="กรอกรหัสผ่าน">
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('loginPassword', this)"></i>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
            </button>
        </form>
        <div class="switch-link">
            ยังไม่มีบัญชี? <a href="#" id="toRegister">ลงทะเบียนที่นี่</a>
        </div>
    </div>

    <!-- ฟอร์มสมัครสมาชิก -->
    <div id="registerFormSection" class="hidden">
        <h2>สมัครสมาชิก</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>ชื่อผู้ใช้ (Username)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user-plus input-icon"></i>
                    <input type="text" id="regUsername" class="form-control" required placeholder="ตั้งชื่อผู้ใช้">
                </div>
            </div>
            <div class="form-group">
                <label>รหัสผ่าน</label>
                <div class="input-wrapper password-wrapper">
                    <i class="fa-solid fa-key input-icon"></i>
                    <input type="password" id="regPassword" class="form-control" required placeholder="ตั้งรหัสผ่าน">
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('regPassword', this)"></i>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-user-check"></i> ลงทะเบียน
            </button>
        </form>

        <div class="line-section">
            <p id="line-status">⚠️ ยังไม่ได้เชื่อมต่อ LINE ID</p>
            <button type="button" id="line-auth-btn" class="btn btn-line" onclick="requestLinePermission()">
                <i class="fa-brands fa-line" style="font-size: 1.2rem;"></i> กดอนุญาตดึง LINE User ID
            </button>
        </div>

        <div class="switch-link">
            มีบัญชีอยู่แล้ว? <a href="#" id="toLogin">เข้าสู่ระบบ</a>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
    function togglePasswordVisibility(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    function showRegisterForm() {
        const loginSec = document.getElementById('loginFormSection');
        const regSec = document.getElementById('registerFormSection');
        if (loginSec && regSec) {
            loginSec.classList.add('hidden');
            regSec.classList.remove('hidden');
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        await Auth.initLIFF();

        if (localStorage.getItem('line_user_id') || localStorage.getItem('line_auth_in_progress') === 'true') {
            localStorage.removeItem('line_auth_in_progress');
            showRegisterForm();
        }

        const currentUser = await Auth.getCurrentUser();
        if (currentUser) {
            window.location.href = 'index.html';
            return;
        }

        document.getElementById('toRegister').addEventListener('click', (e) => {
            e.preventDefault();
            showRegisterForm();
        });

        document.getElementById('toLogin').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('registerFormSection').classList.add('hidden');
            document.getElementById('loginFormSection').classList.remove('hidden');
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                Swal.showLoading();
                await Auth.signIn(username, password);
                window.location.href = 'index.html';
            } catch (err) {
                Swal.fire('ผิดพลาด', err.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'error');
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;

            try {
                Swal.showLoading();
                await Auth.signUp(username, password);
                
                Swal.fire('สำเร็จ', 'ลงทะเบียนเรียบร้อยแล้ว! กรุณาเข้าสู่ระบบ', 'success').then(() => {
                    document.getElementById('registerFormSection').classList.add('hidden');
                    document.getElementById('loginFormSection').classList.remove('hidden');
                    document.getElementById('loginUsername').value = username;
                    document.getElementById('loginPassword').value = '';
                });
            } catch (err) {
                Swal.fire('แจ้งเตือน', err.message || 'ไม่สามารถลงทะเบียนได้', 'warning');
            }
        });
    });
</script>
</body>
</html>
